{% extends 'base.html' %}
{% block title %}Edit Goal{% endblock %}
{% block page_title %}Edit Goal{% endblock %}
{% block content %}
<div class="max-w-lg">
  <div class="card p-6">
    <form method="post">
      {% csrf_token %}
      <div class="space-y-4">
        {% for field in form %}
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
          {{ field }}
        </div>
        {% endfor %}
      </div>
      <div class="flex gap-3 mt-6">
        <button type="submit" class="btn-primary">Save</button>
        <a href="{% url 'appraisal_detail' goal.appraisal.pk %}" class="btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
