{% extends 'base.html' %}
{% block title %}Confirm Delete{% endblock %}
{% block page_title %}Confirm Delete{% endblock %}
{% block content %}
<div class="max-w-md">
  <div class="card p-6">
    <p class="text-gray-700 mb-6">Are you sure you want to delete <strong>{{ object }}</strong>? This cannot be undone.</p>
    <form method="post" class="flex gap-3">
      {% csrf_token %}
      <button type="submit" class="btn-danger">Yes, Delete</button>
      <a href="{% url back_url %}" class="btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
